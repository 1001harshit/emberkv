name: Benchmark

# Compares emberkv with Redis, Kvrocks and Dragonfly: compatibility,
# throughput, memory/disk footprint and crash safety. Run it from the
# Actions tab; the report appears in the run summary and as an artifact.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Optional git ref of an older emberkv to benchmark alongside (e.g. v0.1.0)"
        required: false
        default: ""

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so an older baseline ref can be built
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build emberkv
        run: go build -o bin/ ./cmd/...
      - name: Build baseline
        if: inputs.baseline != ''
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          git worktree add /tmp/baseline "$BASELINE"
          (cd /tmp/baseline && go build -o "$GITHUB_WORKSPACE/bin-baseline/" ./cmd/emberkv)
      - name: Install Redis, its tools and the Python client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server redis-tools
          sudo systemctl stop redis-server || true
          sudo systemctl disable redis-server || true
          pip install redis==5.2.1
      - name: Pull Kvrocks and Dragonfly
        run: |
          docker pull -q apache/kvrocks:latest
          docker pull -q docker.dragonflydb.io/dragonflydb/dragonfly:latest
      - name: Compare
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          args=(--emberkv bin/emberkv --out results)
          if [ -n "$BASELINE" ]; then
            args+=(--baseline bin-baseline/emberkv --baseline-name "$BASELINE ($(git rev-parse --short "$BASELINE"))")
          fi
          python bench/compare.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            results/
            /tmp/emberkv-bench/*.log
